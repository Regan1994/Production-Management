{% extends 'base.html' %}
{% block content %}
<h1>機型主檔</h1>
<section class="panel form-narrow"><h2>新增機型</h2><form method="post" class="model-create-form"><div class="model-create-primary"><label>機型名稱<input name="model_name" required placeholder="例如 HR-255"></label><label>製號字首<input name="serial_prefix" placeholder="例如 E、ER、C、CR"></label></div><div class="model-create-submit"><label>操作者<input name="operator_name" value="admin"></label><button class="button primary">建立</button></div></form></section>
<section class="panel"><h2>現有機型</h2><p class="muted">製號字首用於產生產品製號；例如 E + 年號 27 + 流水號 10 = E27-10。沒有報工或舊機台資料的機型可刪除；已使用的機型請停用。</p><div class="table-wrap"><table class="model-master-table"><thead><tr><th>機型名稱</th><th>狀態</th><th>更新</th></tr></thead><tbody>{% for model in models %}<tr><td>{{ model.model_name }}</td><td>{{ '啟用' if model.is_active else '停用' }}</td><td><div class="model-actions"><form id="model-update-{{ model.id }}" method="post" action="{{ url_for('main.model_update', model_id=model.id) }}" class="inline"><input name="model_name" value="{{ model.model_name }}" required><input name="serial_prefix" value="{{ model.serial_prefix }}" placeholder="製號字首"><select name="is_active"><option value="1" {% if model.is_active %}selected{% endif %}>啟用</option><option value="0" {% if not model.is_active %}selected{% endif %}>停用</option></select><input name="operator_name" value="admin"></form><form method="post" action="{{ url_for('main.model_delete', model_id=model.id) }}" class="inline" onsubmit="return confirm('確定刪除此機型？系統會先備份資料庫；已有報工或舊機台資料的機型無法刪除。')"><input type="hidden" name="csrf_token" value="{{ delete_token }}"><input type="hidden" name="expected_name" value="{{ model.model_name }}"><button class="button small danger" type="submit">刪除</button></form><button class="button small" type="submit" form="model-update-{{ model.id }}">保存</button></div></td></tr>{% else %}<tr><td colspan="3">尚無資料</td></tr>{% endfor %}</tbody></table></div></section>
{% endblock %}
